services:
  db:
    image: postgres:17
    restart: 'on-failure'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    restart: 'on-failure'
    build: .
    ports:
      - '${PORT:-3000}:3000'
    environment:
      - DB_HOST=db
      - API_KEY=${API_KEY:-''}
    depends_on:
      db:
        condition: service_healthy
